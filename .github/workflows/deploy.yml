name: Deploy to VPS

on:
  push:
    branches: [main]
    # The metrics workflow commits these on a schedule; deploying on them
    # would rebuild the site several times a day for no reason.
    paths-ignore:
      - "metrics*.svg"
      - "README.md"
      - ".github/workflows/metrics.yml"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build

      - name: Sanity-check the export
        run: |
          test -f out/index.html
          for p in works awards research about stack contact; do
            test -f "out/$p.html" || { echo "missing out/$p.html"; exit 1; }
          done
          echo "export looks complete: $(find out -type f | wc -l) files"

      - name: Publish
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Fail loudly here rather than as an opaque ssh exit code later.
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null \
            || { echo "VPS_SSH_KEY is not a valid private key"; exit 1; }

          # Build the payload separately so a tar failure is never mistaken for
          # an ssh failure the way it is inside a pipeline.
          tar -czf /tmp/site.tar.gz -C out .
          echo "payload $(du -h /tmp/site.tar.gz | cut -f1), $(tar -tzf /tmp/site.tar.gz | wc -l) entries"

          # The key is pinned to a forced command server-side, so no remote
          # command is passed; stdin is the whole interface.
          for attempt in 1 2 3; do
            echo "--- publish attempt $attempt ---"
            if ssh -o BatchMode=yes \
                   -o StrictHostKeyChecking=accept-new \
                   -o ConnectTimeout=20 \
                   -o ServerAliveInterval=10 \
                   -i ~/.ssh/id_ed25519 \
                   "$VPS_USER@$VPS_HOST" < /tmp/site.tar.gz; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 15
          done

          echo "all three publish attempts failed"
          exit 1

      - name: Verify live site
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # Resolve straight to the VPS, bypassing Cloudflare: its edge
          # blocks GitHub-hosted runners as datacenter traffic, which is a
          # security setting unrelated to whether the publish landed
          # correctly. Checking the origin is what this step actually
          # cares about. Still retries — nginx needs a moment after the
          # file swap — mirroring the Publish step's pattern.
          fail=0
          for p in / /works /awards /research /about /stack /contact /sitemap.xml; do
            code=""
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                --resolve "jnx03.xyz:443:$VPS_HOST" \
                "https://jnx03.xyz$p")
              [ "$code" = "200" ] && break
              sleep 3
            done
            printf '  %-14s %s\n' "$p" "$code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
