name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Main metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: JNX03
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Bangkok
          config_padding: 0, 8 + 11%
          plugin_lines: yes
          plugin_followup: yes
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.languages.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: JNX03
          base: ""
          config_timezone: Asia/Bangkok
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, less, makefile, dockerfile, vim-script
          plugin_languages_details: percentage, lines, bytes-size
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: programming, markup, data

      - name: Habits metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.habits.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: JNX03
          base: ""
          config_timezone: Asia/Bangkok
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 28
          plugin_habits_from: 200

      - name: Achievements metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.achievements.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: JNX03
          base: ""
          config_timezone: Asia/Bangkok
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0
