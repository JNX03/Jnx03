# /etc/nginx/sites-available/jnx03.xyz
# Enable with:
#   ln -s /etc/nginx/sites-available/jnx03.xyz /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Get certificates first (this file assumes they already exist):
#   certbot --nginx -d jnx03.xyz -d www.jnx03.xyz

server {
    listen 80;
    listen [::]:80;
    server_name jnx03.xyz www.jnx03.xyz;

    # Everything except the ACME challenge goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jnx03.xyz$request_uri;
    }
}

# Canonical host redirect, so www never serves a duplicate of the site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.jnx03.xyz;

    ssl_certificate     /etc/letsencrypt/live/jnx03.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jnx03.xyz/privkey.pem;

    return 301 https://jnx03.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jnx03.xyz;

    ssl_certificate     /etc/letsencrypt/live/jnx03.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jnx03.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable, so let the browser keep them for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
