# Shared response headers for jnx03.xyz.
# nginx drops inherited add_header directives in any block that declares its own,
# so every location that sets Cache-Control includes this file too.

# One year, but deliberately NOT includeSubDomains and NOT preload:
# - status/workflow subdomains are managed separately and must not be bound by this
# - preload is effectively irreversible, so it stays an explicit opt-in
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# The site loads no third-party anything: no CDN scripts, no external fonts,
# no analytics. So the policy can be strict. 'unsafe-inline' covers Next's
# inline bootstrap script and the JSON-LD blocks.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
