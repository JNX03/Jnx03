# /etc/nginx/sites-available/jnx03.xyz
#
# Serves the Next.js static export from /var/www/jnx03.xyz.
# There is no Node process: `next build` with output: "export" emits plain files.
#
# Certbot appends the listen 443 / ssl_certificate lines on first issuance.

# www is not canonical; send it to the apex.
server {
    listen 80;
    listen [::]:80;
    server_name www.jnx03.xyz;
    return 301 https://jnx03.xyz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name jnx03.xyz;

    root /var/www/jnx03.xyz;
    index index.html;

    charset utf-8;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/jnx03-common.conf;

    # The export writes works.html, about.html, ... and we link to /works, /about.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Next emits the generated OG cards as extensionless files, so nginx would
    # otherwise serve them as octet-stream and scrapers would reject them.
    location ~ ^/([a-z-]+/)?opengraph-image$ {
        default_type image/png;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/jnx03-common.conf;
    }

    # Content-hashed build output.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/jnx03-common.conf;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/jnx03-common.conf;
    }

    # Cloudflare Pages metadata, meaningless when nginx is the origin.
    location = /_headers { return 404; }
}
