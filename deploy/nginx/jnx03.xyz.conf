# /etc/nginx/sites-available/jnx03.xyz
#
# Serves the Next.js static export from /var/www/jnx03.xyz.
# There is no Node process: `next build` with output: "export" emits plain files.
#
# This file is complete, TLS lines included, so re-uploading it cannot clobber
# certbot's work. Certbot still owns renewal of the cert files themselves.
#
# HTTP/2 matters a lot here: the origin is in Frankfurt and most visitors are
# not, so every extra HTTP/1.1 connection re-pays a ~290ms handshake.

server {
    listen 80;
    listen [::]:80;
    server_name jnx03.xyz www.jnx03.xyz;
    return 301 https://jnx03.xyz$request_uri;
}

# www is not canonical; send it to the apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jnx03.xyz;

    ssl_certificate /etc/letsencrypt/live/jnx03.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jnx03.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://jnx03.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jnx03.xyz;

    ssl_certificate /etc/letsencrypt/live/jnx03.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jnx03.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/jnx03.xyz;
    index index.html;

    charset utf-8;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    include /etc/nginx/snippets/jnx03-common.conf;

    # HTML: browsers revalidate every time, but a CDN may hold it briefly.
    # Keeps deploys visible quickly while still absorbing bursts at the edge.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=300, must-revalidate";
        include /etc/nginx/snippets/jnx03-common.conf;
    }

    # Next emits the generated OG cards as extensionless files, so nginx would
    # otherwise serve them as octet-stream and scrapers would reject them.
    location ~ ^/([a-z-]+/)?opengraph-image$ {
        default_type image/png;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/jnx03-common.conf;
    }

    # Content-hashed build output; safe to keep forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/jnx03-common.conf;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/jnx03-common.conf;
    }

    # Cloudflare Pages metadata, meaningless when nginx is the origin.
    location = /_headers { return 404; }
}
